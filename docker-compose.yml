services:
  relay-server:
    # Prebuilt multi-arch image (amd64 + arm64), built & published by CI.
    # Build your own with:  docker build -t relay-server:local .
    image: ghcr.io/scyslz/relay-server:latest
    container_name: relay-server
    restart: unless-stopped
    environment:
      - TZ=UTC
      # Explicit production mode: the Vite dev server (300MB+) is only ever
      # started when NODE_ENV=development, so keep this set for deployments.
      - NODE_ENV=production
      # Keep the V8 heap under the container memory limit (mem_limit 512m), so
      # the runtime never gets OOM-killed by its own GC headroom.
      - NODE_OPTIONS=--max-old-space-size=384
      # System server port when starting with no config file. If a config file
      # exists (./data/relay-config.json), its server.listenPort wins instead.
      - PORT=${RELAY_PORT:-3000}
      # OPT-IN global skip of outbound HTTPS cert verification for route scripts
      # (fetch/https/axios). Off by default; enable only if needed:
      #   RELAY_TLS_INSECURE=true
      - RELAY_TLS_INSECURE=${RELAY_TLS_INSECURE:-false}
      # Log detail: set to "false" to store only summary records (no route-script
      # console output / stack traces) — keeps the log file small under heavy load.
      - RELAY_LOG_DETAIL=${RELAY_LOG_DETAIL:-true}
      # Execution engine: isolatedvm needs V8 Isolate (SIGSEGV on hosts that
      # block PROT_EXEC JIT, e.g. restricted ARM VPS) — process is the safe
      # default there. Override with RELAY_ENGINE=isolatedvm if your host allows it.
      - RELAY_ENGINE=${RELAY_ENGINE:-process}
    mem_limit: 512m
    ports:
      - "${RELAY_PORT:-3000}:${RELAY_PORT:-3000}"
    volumes:
      # Directory mount (not a single file): relay-config.json and
      # relay-logs.json are auto-created on first start and persisted here.
      # The entrypoint chowns this dir so the non-root server can write it.
      - ./data:/app/data

