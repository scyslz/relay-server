services:
  relay-server:
    # Prebuilt multi-arch image (amd64 + arm64), built & published by CI.
    # Build your own with:  docker build -t relay-server:local .
    image: ghcr.io/scyslz/relay-server:latest
    container_name: relay-server
    restart: unless-stopped
    volumes:
      # Optional: preload apps/routes from a local config file. config.json is
      # your own untracked file (create it once: cp config.json.example config.json),
      # so repo updates never overwrite your running configuration. The server
      # also writes config changes made in the UI back to this file.
      # Remove this line to start fresh and configure everything from the UI.
      - ./config.json:/app/data/relay-config.json
      # Writable storage for execution logs (survives container recreation).
      - relay_logs:/app/data
    environment:
      - TZ=UTC

volumes:
  relay_logs:
